# 职工素质评议系统 —— Nginx 站点配置
#
# 放置位置（Ubuntu/Debian）：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/staff-vote
#   sudo ln -sf /etc/nginx/sites-available/staff-vote /etc/nginx/sites-enabled/staff-vote
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前端与后端同域：前端静态文件由本配置直接托管，/api 反代到本机 Node 进程。
# 同域是刻意的选择 —— 管理端会话用 httpOnly + SameSite=Lax 的 Cookie，
# 跨域会让 Cookie 策略与 CSRF 防护复杂度陡增。

upstream staff_vote_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    # 改成实际域名或服务器 IP
    server_name _;

    # 后端日志里要能看到真实 IP（限流与审计都依赖它）
    access_log /var/log/nginx/staff-vote.access.log;
    error_log  /var/log/nginx/staff-vote.error.log;

    # 职工名单 Excel/CSV 导入需要更大的请求体上限
    client_max_body_size 10m;

    # 直接指向仓库里的前端构建产物，无需另拷一份
    # （构建方式见 deploy/README.md 第 4 步）
    root /opt/staff-vote/apps/web/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/admin/results 之类的前端路由需要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # 入口 HTML 不缓存，否则发版后用户仍加载旧版引用
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://staff_vote_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 后端 app.ts 里设置了 app.set('trust proxy', 1)，
        # 正是为配合这里的 X-Forwarded-For —— 否则 express-rate-limit
        # 会把所有请求都当成来自 127.0.0.1，限流退化成对全体用户共享一个额度。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}